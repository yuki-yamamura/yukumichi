name: Web CI

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "apps/web/**"
    branches:
      - main

jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sanpo/web run format
      - run: pnpm --filter @sanpo/web run lint
      - run: pnpm --filter @sanpo/web run lint:style
      - run: pnpm --filter @sanpo/web run check-types
      - run: pnpm --filter @sanpo/web run knip
      - run: pnpm exec playwright install chromium
      - run: pnpm --filter @sanpo/web run test
      - run: pnpm --filter @sanpo/web run storybook:build
