name: API CI

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "apps/api/**"
      - "packages/**"
    branches:
      - main

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AWS_REGION: ap-northeast-1
      COGNITO_CLIENT_ID: dummy-client-id
      COGNITO_USER_POOL_ID: dummy-user-pool-id
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yukumichi/api run format
      - run: pnpm --filter @yukumichi/api run lint
      - run: pnpm --filter @yukumichi/api run check-types
      - run: pnpm --filter @yukumichi/api run knip
      - run: pnpm --filter @yukumichi/api run test
