name: Web Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://yjm6bp4rijy76266jphlcoshlm0tqjku.lambda-url.ap-northeast-1.on.aws
      NEXT_PUBLIC_AWS_REGION: ap-northeast-1
      NEXT_PUBLIC_COGNITO_CLIENT_ID: 2tcimlfgtvseri5p7tg76qh88d
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-northeast-1_W4GRQjQOp
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yukumichi/api run check-types
      - name: Build and deploy
        run: pnpm --filter @yukumichi/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
