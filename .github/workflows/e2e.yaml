name: E2E

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/e2e/**"
      - "packages/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: yukumichi
          POSTGRES_USER: yukumichi
          POSTGRES_PASSWORD: yukumichi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AWS_REGION: ap-northeast-1
      COGNITO_CLIENT_ID: dummy-client-id
      COGNITO_USER_POOL_ID: ap-northeast-1_dummyPool
      DATABASE_URL: postgres://yukumichi:yukumichi@localhost:5432/yukumichi
      API_BASE_URL: http://localhost:3010
      NEXT_PUBLIC_AWS_REGION: ap-northeast-1
      NEXT_PUBLIC_COGNITO_CLIENT_ID: dummy-client-id
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-northeast-1_dummyPool
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api check-types
      - run: pnpm --filter web build
      - run: pnpm --filter @yukumichi/e2e exec playwright install --with-deps chromium
      - name: Start servers
        run: |
          nohup pnpm --filter api exec tsx src/server.ts > /tmp/api.log 2>&1 &
          nohup pnpm --filter web run start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            API_OK=false; WEB_OK=false
            curl -sf http://localhost:3010/spots > /dev/null 2>&1 && API_OK=true
            curl -sf http://localhost:3000 > /dev/null 2>&1 && WEB_OK=true
            if $API_OK && $WEB_OK; then
              echo "Both servers ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server startup failed after 30s"
          echo "=== API log ===" && cat /tmp/api.log
          echo "=== Web log ===" && cat /tmp/web.log
          exit 1
      - run: pnpm --filter e2e test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
