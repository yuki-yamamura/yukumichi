name: E2E

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sanpo
          POSTGRES_USER: sanpo
          POSTGRES_PASSWORD: sanpo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgres://sanpo:sanpo@localhost:5432/sanpo
      API_BASE_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api check-types
      - run: pnpm --filter web build
      - run: pnpm dlx playwright install --with-deps chromium
      - name: Start servers
        run: |
          nohup pnpm --filter api exec tsx src/server.ts > /tmp/api.log 2>&1 &
          nohup pnpm --filter web run start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            API_OK=false; WEB_OK=false
            curl -sf http://localhost:3010/spots > /dev/null 2>&1 && API_OK=true
            curl -sf http://localhost:3000 > /dev/null 2>&1 && WEB_OK=true
            if $API_OK && $WEB_OK; then
              echo "Both servers ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server startup failed after 30s"
          echo "=== API log ===" && cat /tmp/api.log
          echo "=== Web log ===" && cat /tmp/web.log
          exit 1
      - run: pnpm --filter e2e test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
