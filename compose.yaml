services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "timezone=UTC"
    ports:
      - "5432:5432"
    volumes:
      - sanpo_postgres_data:/var/lib/postgresql/data
    networks:
      - sanpo-network

  api:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-3010}:3010"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - sanpo-network

networks:
  sanpo-network:
    driver: bridge

volumes:
  sanpo_postgres_data:
